<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Zenith Security Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", system-ui, sans-serif;
      background: #fffafb;
      color: #1b1418;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ffe0e4;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 540px;
      box-shadow: 0 20px 50px -28px rgba(27, 20, 24, 0.35);
      margin: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #5c0a17;
      color: #ffc6cf;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 72px;
      margin: 0;
      color: #e11d3f;
      font-family: "JetBrains Mono", monospace;
      line-height: 1;
    }
    h2 {
      font-size: 22px;
      margin: 12px 0;
    }
    p {
      color: #6b5b62;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #e11d3f;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #c8102e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 — Not Found</div>
    <h1>404</h1>
    <h2>Security Endpoint Not Located</h2>
    <p>The requested route or dashboard resource could not be found.</p>
    <a href="/" class="btn">Return to Zenith Dashboard</a>
  </div>
</body>
</html>
